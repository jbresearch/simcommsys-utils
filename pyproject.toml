[tool.poetry]
name = "simcommsys-utils"
version = "0.1.2"
description = "A package that aids in building, running and plotting results from Simcommsys systems, timers and simulations."
authors = [
    "Mark Mizzi <mark.mizzi@um.edu.mt>",
    "Johann A. Briffa <johann.briffa@um.edu.mt>"
]
license = "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"
readme = "README.md"
packages = [{include = "simcommsys_utils"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12.5"
pyyaml = "^6.0.2"
matplotlib = "^3.9.2"
numpy = "^2.1.3"
pydantic = "^2.10.4"
click = "~8.1.8"


[tool.poetry.dev-dependencies]
types-pyyaml = "^6.0.12.20240917"
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
simcommsys-utils = 'simcommsys_utils.cli:app'
