executor:
  type: local
  workers: 4
jobs:
  group1:
    base_dir: ../Simulators
    glob: "errors_hamming-random-awgn*.txt"
    output_dir: ../Results
    log_dir: ../Logs
    params:
      - - 2.7
      - - 1.5
    confidence: 0.9
    relative_error: 0.1
    floor_min: 0.5e-3
    # NOTE: Tag likely needs to be changed on your machine
    simcommsys_tag: v1.2.3-1065-g6e37b8c8.sierraforest
    simcommsys_type: release
    memlimit_gb: 4
  group2:
    base_dir: ..
    rgx: "Simulators/errors_hamming-random-qsc.*\\.txt"
    output_dir: Results
    log_dir: Logs
    param_ranges:
      - "geometric:0.4:0.5:0.15"
    confidence: 0.95
    relative_error: 0.05
    floor_min: 1e-3
    # NOTE: Tag likely needs to be changed on your machine
    simcommsys_tag: v1.2.3-1065-g6e37b8c8.sierraforest
    simcommsys_type: release
