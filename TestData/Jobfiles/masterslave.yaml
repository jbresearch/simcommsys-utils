executor:
  type: masterslave
jobs:
  group1:
    # Folders and simulation files
    base_dir: ../Simulators
    glob: "masterslave-errors_hamming-random-awgn*.txt"
    output_dir: ../Results
    log_dir: ../Logs
    # Simulation parameters
    params:
      - - 2.7
      - - 1.5
    confidence: 0.9
    relative_error: 0.1
    floor_min: 0.5e-3
    # Job parameters
    memlimit_gb: 4
    workers: 4
    # NOTE: The build variant likely needs to be changed on your machine
    build_version: v1.2.3-1069-gedc4c129
    build_variant: sierraforest
    #build_variant: icelake-server
    build_config: release
  group2:
    # Folders and simulation files
    base_dir: ..
    rgx: "Simulators/masterslave-errors_hamming-random-qsc.*\\.txt"
    output_dir: Results
    log_dir: Logs
    # Simulation parameters
    param_ranges:
      - "geometric:0.4:0.5:0.15"
    confidence: 0.95
    relative_error: 0.05
    floor_min: 1e-3
    # Job parameters
    # NOTE: The build variant likely needs to be changed on your machine
    build_version: v1.2.3-1069-gedc4c129
    build_variant: sierraforest
    #build_variant: icelake-server
    build_config: release
